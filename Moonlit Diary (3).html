/* Layout: a single leather-bound book centred on a dark desk; one leaf visible, page turns swing around the spine. Tools sit in a rail under the book. */
:root {
  --desk: #120a1a;
  --desk2: #1d1029;
  --leather: #2a1230;
  --rose: #ff7ab6;
  --blood: #b3123f;
  --lilac: #cdb4ff;
  --bone: #f6e9ef;
  --muted: #a995b8;
  --ui: 'Handlee', cursive, system-ui, sans-serif;
  --gothic: 'Pirata One', 'UnifrakturCook', serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--desk); color: var(--bone); font-family: var(--ui);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px;
  display: flex; flex-direction: column; gap: 10px; overflow: hidden;
  background-image:
    radial-gradient(900px 500px at 50% -10%, rgba(255,122,182,.12), transparent 60%),
    radial-gradient(700px 500px at 100% 100%, rgba(205,180,255,.10), transparent 60%);
}
button { font-family: inherit; color: inherit; cursor: pointer; }
button:focus-visible, select:focus-visible, input:focus-visible, [contenteditable]:focus-visible { outline: 2px solid var(--rose); outline-offset: 2px; }

/* header */
header { display: flex; align-items: center; gap: 10px; flex: none; min-width: 0; }
.brand { font-family: var(--gothic); font-size: 26px; letter-spacing: .5px; color: #ffd6e7; text-shadow: 0 0 14px rgba(255,122,182,.45); white-space: nowrap; }
.brand i { font-style: normal; color: var(--rose); }
.spacer { flex: 1; }
.chip {
  border: 1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.06); border-radius: 999px;
  padding: 7px 13px; font-size: 13px; font-weight: 600; display: inline-flex; gap: 6px; align-items: center;
}
.chip:hover { background: rgba(255,122,182,.18); }
.chip[aria-pressed="true"] { background: rgba(255,122,182,.28); border-color: var(--rose); }
#status { font-size: 12px; color: var(--muted); text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }

/* stage + book */
#stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; position: relative; }
#book { position: relative; perspective: 1800px; flex: none; }
#book .binding {
  position: absolute; inset: -10px -8px -12px -16px; border-radius: 10px 18px 18px 10px;
  background: linear-gradient(90deg, #12061a 0 14px, var(--leather) 14px, #3a1a42 100%);
  box-shadow: 0 24px 50px rgba(0,0,0,.6), inset 0 0 0 2px rgba(255,122,182,.28), inset 0 0 0 5px rgba(0,0,0,.35);
}
#book .binding::after { /* page edges */
  content: ""; position: absolute; top: 8px; bottom: 8px; right: 3px; width: 8px; border-radius: 0 4px 4px 0;
  background: repeating-linear-gradient(180deg, #e9dcd2 0 2px, #bfb0a6 2px 3px);
  opacity: .0;
}
.leaf {
  position: absolute; inset: 0; border-radius: 3px 12px 12px 3px; overflow: hidden;
  transform-origin: left center; backface-visibility: hidden;
  box-shadow: inset 14px 0 18px -10px rgba(0,0,0,.45), inset -2px 0 0 rgba(0,0,0,.12);
}
.leaf.flipper { z-index: 5; will-change: transform; }
.leaf.flipper.fwd { animation: turnFwd .62s cubic-bezier(.5,.1,.3,1) forwards; }
.leaf.flipper.back { animation: turnBack .62s cubic-bezier(.5,.1,.3,1) forwards; }
@keyframes turnFwd { from { transform: rotateY(0); } to { transform: rotateY(-112deg); opacity: .0; } }
@keyframes turnBack { from { transform: rotateY(-112deg); opacity: .0; } to { transform: rotateY(0); opacity: 1; } }
.leaf.flipper::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(0,0,0,.28), transparent 40%); pointer-events: none; }

/* page paper */
.page {
  position: absolute; inset: 0; display: flex; flex-direction: column; gap: 6px;
  padding: 26px 24px 22px 30px; background-color: var(--p-bg); color: var(--p-ink);
  background-image: var(--p-tex, none);

.deco.bl { bottom: 6px; left: 14px; background-position: bottom left; background-image: var(--d-bl); width: 84px; height: 84px; }
.meta { display: flex; align-items: baseline; gap: 10px; position: relative; z-index: 1; padding-right: 70px; min-width: 0; }
.meta .date { font-size: 13px; opacity: .8; font-family: var(--ui); font-weight: 600; letter-spacing: .02em; white-space: nowrap; }
.meta .mood { border: 0; background: transparent; font-size: 18px; padding: 0 2px; line-height: 1; }
.ptitle {
  position: relative; z-index: 1; width: 100%; border: 0; background: transparent; color: inherit; padding: 2px 0 4px;
  font-family: var(--p-title-font); font-size: 31px; line-height: 1.15; border-bottom: 1.5px solid var(--p-line2);
}
.ptitle::placeholder { color: inherit; opacity: .38; }
.pbody {
  position: relative; z-index: 1; flex: 1; min-height: 0; overflow-y: auto; outline: none; padding: 0 2px; margin-top: 2px;
  font-family: var(--f); font-size: var(--fs); line-height: var(--lh); word-wrap: break-word; overflow-wrap: anywhere;
  background-color: var(--p-panel, transparent);
  background-image: repeating-linear-gradient(to bottom, transparent 0, transparent calc(var(--lh) - 1.5px), var(--p-line) calc(var(--lh) - 1.5px), var(--p-line) var(--lh));
  background-attachment: local; border-radius: 4px;
}
.pbody:empty::before { content: attr(data-ph); opacity: .4; pointer-events: none; }
.pbody::-webkit-scrollbar { width: 6px; } .pbody::-webkit-scrollbar-thumb { background: var(--p-line2); border-radius: 4px; }
.pnum { position: absolute; bottom: 14px; right: 28px; font-size: 12px; opacity: .6; z-index: 1; font-weight: 600; }
.curl { position: absolute; bottom: 0; width: 46px; height: 46px; z-index: 3; border: 0; background: transparent; padding: 0; }
.curl.r { right: 0; background: linear-gradient(135deg, transparent 50%, rgba(0,0,0,.18) 50%, rgba(255,255,255,.55) 60%, rgba(255,255,255,.2) 100%); border-radius: 100% 0 12px 0; }
.curl.l { left: 6px; background: linear-gradient(225deg, transparent 50%, rgba(0,0,0,.18) 50%, rgba(255,255,255,.4) 60%, rgba(255,255,255,.1) 100%); border-radius: 0 100% 0 0; }
.curl:hover { filter: brightness(1.15); }

/* cover */
.cover {

  padding: 36px 30px; color: #ffe3ef;
  background: radial-gradient(circle at 50% 30%, #4a1d52 0, #2a1230 55%, #170a1d 100%);

.cover::before { content: ""; position: absolute; inset: 14px 14px 14px 22px; border: 3px double rgba(255,122,182,.7); border-radius: 12px; pointer-events: none; }
.cover .moon { width: 92px; height: 92px; filter: drop-shadow(0 0 14px rgba(255,214,231,.6)); }
.cover input { background: transparent; border: 0; text-align: center; color: inherit; width: 100%; }
.cover .ctitle { font-family: var(--gothic); font-size: 52px; line-height: 1; text-shadow: 0 0 18px rgba(255,122,182,.55); }
.cover .csub { font-family: 'Handlee', cursive; font-size: 20px; color: var(--lilac); }
.cover .cown { font-family: 'Ingrid Darling', 'Handlee', cursive; font-size: 24px; border-bottom: 1.5px dashed rgba(255,122,182,.6) !important; width: 70% !important; }
.cover .hint { font-size: 12px; opacity: .6; margin-top: 8px; }
.ribbon { position: absolute; top: -4px; right: 36px; width: 26px; height: 120px; background: var(--rose); clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 86%, 0 100%); box-shadow: 0 4px 10px rgba(0,0,0,.4); z-index: 2; }

/* nav + tools */
.nav { display: flex; align-items: center; justify-content: center; gap: 10px; flex: none; }
.nbtn { width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.07); font-size: 20px; }
.nbtn:hover:not(:disabled) { background: rgba(255,122,182,.25); }
.nbtn:disabled { opacity: .3; cursor: default; }
#count { font-weight: 700; min-width: 70px; text-align: center; font-size: 15px; }
#tools { flex: none; display: flex; gap: 6px; align-items: center; overflow-x: auto; padding: 4px 2px 6px; scrollbar-width: thin; }
#tools > * { flex: none; }
.tb { min-width: 38px; height: 38px; border-radius: 10px; border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.06); font-size: 15px; padding: 0 9px; }
.tb:hover { background: rgba(255,122,182,.2); }
.sep { width: 1px; height: 24px; background: rgba(255,255,255,.14); margin: 0 4px; }
select.tb { appearance: none; padding: 0 10px; background-color: #26142f; color: var(--bone); max-width: 150px; }
.swatch { width: 28px; height: 28px; border-radius: 50%; border: 2px solid rgba(255,255,255,.5); padding: 0; }
.pop {
  position: absolute; z-index: 20; background: #241230; border: 1px solid rgba(255,122,182,.4); border-radius: 14px; padding: 10px;

.row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
.btn { border: 1px solid rgba(255,255,255,.2); background: rgba(255,255,255,.07); padding: 10px 16px; border-radius: 12px; font-weight: 700; font-size: 14px; }
.btn.pri { background: var(--rose); color: #2a0a18; border-color: var(--rose); }
.btn.danger { border-color: #ff5d7d; color: #ffb3c1; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: #2d1638; border: 1px solid var(--rose); border-radius: 999px; padding: 9px 16px; font-size: 13px; z-index: 40; }

.shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 14px; }

        var d2 = mk('span'); d2.style.cssText = 'position:absolute;bottom:2px;left:2px;width:44px;height:44px;background:' + P.bl + ' no-repeat bottom left/contain';
        var ln = mk('span'); ln.style.cssText = 'position:absolute;left:12px;right:12px;top:48px;height:56px;background:repeating-linear-gradient(to bottom,transparent 0 12px,' + P.line2 + ' 12px 13px)';
        sw.appendChild(ln); sw.appendChild(d1); sw.appendChild(d2); sw.appendChild(mk('span', 'tag', P.tag));
        b.appendChild(sw); b.appendChild(mk('span', 'nm', P.name));
        b.onclick = function () { pg.paper = P.id; touch(); closeSheet(); show(cur); }; g.appendChild(b);
      });
      card.appendChild(g);
    });
  }
  function delSheet() {
    sheet('Tear out this page?', 'This page and everything written on it will be gone.', function (card) {
      var row = mk('div', 'row'); var y = mk('button', 'btn danger', 'Tear it out'); y.onclick = function () {
        S.pages.splice(cur - 1, 1); if (cur > S.pages.length) cur = S.pages.length; touch(); closeSheet(); show(cur);
      }; row.appendChild(y); card.appendChild(row);
    });
  }
  document.getElementById('pagesBtn').onclick = function () {
    sheet('Pages', 'Tap a page to jump to it.', function (card) {
      var g = mk('div', 'grid');
      var all = [{ cover: true }].concat(S.pages);
      all.forEach(function (pg, i) {
        var b = mk('button', 'pg-opt'); if (i === cur) b.setAttribute('aria-current', 'true');
        var sw = mk('span', 'sw');
        if (pg.cover) { sw.style.background = 'radial-gradient(circle at 50% 30%, #4a1d52, #170a1d)'; sw.style.color = '#ffe3ef'; sw.innerHTML = '<b></b>'; sw.firstChild.textContent = S.cover.title || 'Cover'; }
        else { var P = paperById[pg.paper] || PAPERS[0]; sw.style.backgroundColor = P.bg; if (P.tex) sw.style.backgroundImage = P.tex; sw.style.color = P.ink; var t = mk('b'); t.textContent = (pg.mood || '') + ' ' + (pg.title || 'Untitled'); sw.appendChild(t); sw.appendChild(document.createTextNode((pg.body || '').replace(/<[^>]*>/g, ' ').replace(/&nbsp;/g, ' ').trim().slice(0, 70))); }
        b.appendChild(sw); b.appendChild(mk('span', 'nm', i === 0 ? 'Cover' : 'Page ' + i));
        b.onclick = function () { closeSheet(); jump(i); }; g.appendChild(b);
      });
      card.appendChild(g);
    });
  };
  function jump(i) { if (i === cur) return; if (Math.abs(i - cur) === 1) { go(i - cur); return; } cur = i; S.cur = cur; saveLocal(); show(cur); }

  /* ---------- diaries shelf ---------- */
  function coverBg(h) { var H = COVERS[h || 0] || COVERS[0]; return 'radial-gradient(circle at 50% 30%, ' + H[0] + ' 0, ' + H[1] + ' 55%, ' + H[2] + ' 100%)'; }
  function swapIn() { book.classList.remove('swap'); void book.offsetWidth; book.classList.add('swap'); show(cur); refreshBrand(); }
  function openBook(id) {
    if (id === S.id) { closeSheet(); return; }
    flush(); activate(id); touch(); closeSheet(); swapIn();
  }
  function shelfSheet() {
    flush(); persist();
    sheet('Your diaries', 'Tap one to open it. Every diary saves as you write.', function (card) {
      var g = mk('div', 'shelf');
      shelf.books.forEach(function (b) {
        var bt = mk('button', 'bk'); if (b.id === S.id) bt.setAttribute('aria-current', 'true');
        var cv = mk('span', 'cv'); cv.style.background = coverBg(b.cover.hue);
        cv.appendChild(mk('span', null, '☾', { style: 'font-size:22px;color:#ffd6e7' }));
        cv.appendChild(mk('b', null, b.cover.title || 'My Diary'));
        if (b.cover.owner) cv.appendChild(mk('small', null, b.cover.owner));
        bt.appendChild(cv); bt.appendChild(mk('span', 'nm', b.pages.length + (b.pages.length === 1 ? ' page' : ' pages')));
        bt.onclick = function () { openBook(b.id); }; g.appendChild(bt);
      });
      var nb = mk('button', 'bk new'); nb.appendChild(mk('span', 'cv', '＋')); nb.appendChild(mk('span', 'nm', 'New diary')); nb.onclick = newBookSheet; g.appendChild(nb);
      card.appendChild(g);
      if (shelf.books.length > 1) {
        var row = mk('div', 'row'); var d = mk('button', 'btn danger', 'Delete “' + (S.cover.title || 'My Diary') + '”'); d.onclick = delBookSheet; row.appendChild(d); card.appendChild(row);
      }
    });
  }
  function newBookSheet() {
    var hue = 0;
    sheet('New diary', 'Name it and pick a cover. You can rename it on the cover any time.', function (card) {
      var inp = mk('input', 'fld', null, { maxlength: 28, placeholder: 'My Diary', 'aria-label': 'Diary name' });
      var dots = mk('div', 'dots'); dots.style.marginBottom = '4px';
      COVERS.forEach(function (H, i) {
        var d = mk('button', 'dot', null, { 'aria-label': 'Cover ' + (i + 1) }); d.style.background = coverBg(i); d.setAttribute('aria-pressed', i === 0);
        d.onclick = function () { hue = i; [].forEach.call(dots.children, function (x, j) { x.setAttribute('aria-pressed', j === i); }); }; dots.appendChild(d);
      });
      var row = mk('div', 'row'); var ok = mk('button', 'btn pri', 'Create diary');
      ok.onclick = function () { createBook(inp.value.trim(), hue); };
      inp.onkeydown = function (e) { if (e.key === 'Enter') createBook(inp.value.trim(), hue); };
      card.appendChild(inp); card.appendChild(dots); row.appendChild(ok); card.appendChild(row);
      setTimeout(function () { inp.focus(); }, 60);
    });
  }
  function createBook(name, hue) {
    flush(); var now = Date.now();
    var b = { id: uid(), v: 1, updated: now, cur: 0, cover: { title: name || 'My Diary', sub: 'this book belongs to', owner: S.cover.owner || '', hue: hue },
      pages: [{ id: uid(), paper: 'batheart', font: 0, size: 22, mood: '🌸', created: now, title: '', body: '' }] };
    shelf.books.push(b); activate(b.id); touch(); closeSheet(); swapIn();
  }
  function delBookSheet() {
    sheet('Delete this diary?', '“' + (S.cover.title || 'My Diary') + '” and every page in it will be gone for good.', function (card) {
      var row = mk('div', 'row'); var y = mk('button', 'btn danger', 'Delete diary');
      y.onclick = function () {
        var i = shelf.books.indexOf(S); shelf.books.splice(i, 1);
        activate(shelf.books[Math.max(0, i - 1)].id); touch(); closeSheet(); swapIn();
      };
      row.appendChild(y); card.appendChild(row);
    });
  }
  document.getElementById('shelfBtn').onclick = shelfSheet;
  document.getElementById('saveBtn').onclick = saveNow;

  /* ---------- swipe ---------- */
  var sx = 0, sy = 0, st0 = 0;
  stage.addEventListener('touchstart', function (e) { var t = e.touches[0]; sx = t.clientX; sy = t.clientY; st0 = Date.now(); }, { passive: true });
  stage.addEventListener('touchend', function (e) {
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    var sel = window.getSelection && window.getSelection(); if (sel && !sel.isCollapsed) return;
    if (Math.abs(dx) > 70 && Math.abs(dy) < 45 && Date.now() - st0 < 600) go(dx < 0 ? 1 : -1);
  }, { passive: true });

  /* ---------- rain ---------- */
  var actx = null, rain = null;
  var rainBtn = document.getElementById('rainBtn');
  rainBtn.onclick = function () {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (rain) { rain.g.gain.setTargetAtTime(0, actx.currentTime, .3); var r0 = rain; rain = null; setTimeout(function () { r0.src.stop(); }, 1200); rainBtn.setAttribute('aria-pressed', 'false'); return; }
      var len = actx.sampleRate * 3, buf = actx.createBuffer(1, len, actx.sampleRate), d = buf.getChannelData(0), last = 0;
      for (var i = 0; i < len; i++) { var w = Math.random() * 2 - 1; last = (last + 0.04 * w) / 1.04; d[i] = last * 6 + w * 0.12; }
      var src = actx.createBufferSource(); src.buffer = buf; src.loop = true;
      var hp = actx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 500;
      var lp = actx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 7000;
      var g = actx.createGain(); g.gain.value = 0; src.connect(hp); hp.connect(lp); lp.connect(g); g.connect(actx.destination); src.start();
      g.gain.setTargetAtTime(.35, actx.currentTime, .5); rain = { src: src, g: g }; rainBtn.setAttribute('aria-pressed', 'true');
    } catch (e) { }
  };

  /* ---------- boot ---------- */
  sizeBook(); show(cur); refreshBrand(); setStatus('saved here');
  window.addEventListener('pagehide', function () { flush(); saveLocal(); });
  document.addEventListener('visibilitychange', function () { if (document.hidden) { flush(); persist(); } });

  // Cloud copy: private to the signed-in viewer. Newer copy wins.
  (async function () {
    try {
      var db = await window.claude.use('db'), user = await window.claude.use('user');
      if (!db || !user) return;
      var id = await user.id(); if (!id) return;
      var ref = db.collection('data/users/' + id).doc('diary');
      var snap = await ref.get();
      if (snap.exists) {
        var rec = snap.data(); var remote = fixShelf(rec && rec.book ? JSON.parse(rec.book) : null);
        if (remote && (remote.updated || 0) > (shelf.updated || 0) && !busy) {
          shelf = remote; activate(shelf.active); saveLocal(); show(cur); refreshBrand();
        }
        lastSavedStr = rec && rec.book || '';
      }
      dbDoc = ref; dbReady = true;
      if (JSON.stringify(shelf) !== lastSavedStr) persist(); else setStatus('saved ♡');
    } catch (e) { }
  })();
})();
</script>
